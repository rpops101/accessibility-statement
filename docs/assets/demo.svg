<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 486" width="918" height="486" role="img" aria-labelledby="t d">
<title id="t">Four commands turn an axe-core report into a German accessibility statement</title>
<desc id="d">Two panels. Left, a terminal: the directory contains only axe.json; "npx accessibility-statement init" writes a11y-statement.config.yaml and manual.yaml; "npx accessibility-statement render statement --jurisdiction de --lang de --out statement.html" writes statement.html; "npx accessibility-statement check" reports no conformance changes against the baseline. Right, the resulting statement.html: a dashed draft notice reading "ENTWURF — zur menschlichen Prüfung. Kein Rechtsrat; vor Veröffentlichung prüfen."; the heading "Erklärung zur Barrierefreiheit"; a compliance section stating My Website is partially compliant with EN 301 549; a non-accessible content section listing WCAG 1.1.1 Nicht-Text-Inhalt against EN 301 549 clause 9.1.1.1 and WCAG 1.4.3 Kontrast (Minimum) against clause 9.1.4.3; and an enforcement section naming the Marktüberwachungsstelle der Länder (MLBF).</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.m{font-size:12.5px;fill:#c9d1d9}
.chrome{font-size:10.5px;fill:#8b949e}
.doc-chrome{fill:#57606a}
.pr{fill:#7ee787}
.ar{fill:#58a6ff}
.cmd{fill:#e6edf3}
.ok{fill:#7ee787}
.dim{fill:#8b949e}
.cur{fill:#58a6ff}
.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1a1a1a}
.h1{font-size:15px;font-weight:700}
.h2{font-size:12.5px;font-weight:700;fill:#24292f}
.body{font-size:11.5px;fill:#24292f}
.li{font-size:11.5px;fill:#8f1919;font-weight:600}
.li-sub{font-size:10.5px;fill:#57606a}
.draft{font-size:11px;font-weight:700;fill:#5c4a00}
.draft-sm{font-size:10px;fill:#5c4a00}
</style>
<rect width="918" height="486" rx="12" fill="#010409"/>
<rect x="18" y="18" width="460" height="450" rx="9" fill="#0d1117" stroke="#30363d"/>
<path d="M18 27a9 9 0 0 1 9-9h442a9 9 0 0 1 9 9v21H18z" fill="#161b22"/>
<circle cx="36" cy="33" r="4.5" fill="#ff5f57"/>
<circle cx="52" cy="33" r="4.5" fill="#febc2e"/>
<circle cx="68" cy="33" r="4.5" fill="#28c840"/>
<text x="248" y="37" text-anchor="middle" class="chrome">terminal</text>
<text x="32" y="74" class="m"><tspan class="pr">~/my-project</tspan><tspan class="ar"> $ </tspan><tspan class="cmd">ls</tspan></text>
<text x="32" y="94" class="m dim">axe.json</text>
<text x="32" y="124" class="m"><tspan class="pr">~/my-project</tspan><tspan class="ar"> $ </tspan><tspan class="cmd">npx accessibility-statement init</tspan></text>
<text x="32" y="144" class="m ok">Wrote a11y-statement.config.yaml</text>
<text x="32" y="164" class="m ok">Wrote manual.yaml</text>
<text x="32" y="194" class="m"><tspan class="pr">~/my-project</tspan><tspan class="ar"> $ </tspan><tspan class="cmd">npx accessibility-statement render statement \</tspan></text>
<text x="32" y="214" class="m cmd">    --jurisdiction de --lang de \</text>
<text x="32" y="234" class="m cmd">    --out statement.html</text>
<text x="32" y="254" class="m ok">Wrote statement.html</text>
<text x="32" y="284" class="m"><tspan class="pr">~/my-project</tspan><tspan class="ar"> $ </tspan><tspan class="cmd">npx accessibility-statement check</tspan></text>
<text x="32" y="304" class="m ok">No conformance changes</text>
<text x="32" y="324" class="m ok">against the baseline.</text>
<text x="32" y="350" class="m"><tspan class="pr">~/my-project</tspan><tspan class="ar"> $ </tspan></text>
<rect x="500" y="18" width="400" height="450" rx="9" fill="#ffffff" stroke="#30363d"/>
<path d="M500 27a9 9 0 0 1 9-9h382a9 9 0 0 1 9 9v21H500z" fill="#f0f0f0"/>
<text x="700" y="37" text-anchor="middle" class="chrome doc-chrome">statement.html</text>
<rect x="512" y="60" width="376" height="38" fill="#fff8e1" stroke="#8a6d00" stroke-width="2" stroke-dasharray="5 3"/>
<text x="520" y="74" class="s draft">ENTWURF — zur menschlichen Prüfung.</text>
<text x="520" y="94" class="s draft-sm">Kein Rechtsrat; vor Veröffentlichung prüfen.</text>
<text x="516" y="129" class="s h1">Erklärung zur Barrierefreiheit</text>
<text x="516" y="149" class="s body">My Organisation: Diese Erklärung gilt für</text>
<text x="516" y="169" class="s body">My Website.</text>
<text x="516" y="198" class="s h2">Stand der Vereinbarkeit</text>
<text x="516" y="218" class="s body">My Website ist teilweise mit den</text>
<text x="516" y="238" class="s body">Anforderungen der EN 301 549 vereinbar.</text>
<text x="516" y="267" class="s h2">Nicht barrierefreie Inhalte</text>
<text x="516" y="287" class="s li">&#8226;</text>
<text x="528" y="287" class="s li">1.1.1 Nicht-Text-Inhalt</text>
<text x="528" y="307" class="s li-sub">EN 301 549 Abschnitt 9.1.1.1</text>
<text x="516" y="327" class="s li">&#8226;</text>
<text x="528" y="327" class="s li">1.4.3 Kontrast (Minimum)</text>
<text x="528" y="347" class="s li-sub">EN 301 549 Abschnitt 9.1.4.3</text>
<text x="516" y="376" class="s h2">Durchsetzungsverfahren</text>
<text x="516" y="396" class="s body">Marktüberwachungsstelle der Länder (MLBF)</text>
</svg>
