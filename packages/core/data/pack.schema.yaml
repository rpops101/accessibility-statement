# Schema for jurisdiction pack metadata (pack.yaml) — REQ-PACK-2.
# The schema is the reviewer: a structurally valid pack with passing
# snapshots is mergeable on translation review alone.
# A JSON mirror is generated at packages/packs/schema/pack.schema.json.
type: object
required: [schemaVersion, country, name, languages, defaultLanguage, legal, enforcement, quality]
additionalProperties: false
properties:
  schemaVersion:
    type: integer
    enum: [1]
  country:
    type: string
    pattern: "^[a-z]{2}$"
  name:
    type: string
    minLength: 1
  languages:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[a-z]{2}(-[A-Za-z0-9-]+)?$"
  defaultLanguage:
    type: string
    pattern: "^[a-z]{2}(-[A-Za-z0-9-]+)?$"
  legal:
    type: object
    required: [act, sources]
    properties:
      act:
        type: string
        minLength: 1
      references:
        type: array
        items:
          type: string
      sources:
        type: array
        minItems: 1
        items:
          type: string
          pattern: "^https://"
  enforcement:
    type: object
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
      url:
        type: string
      email:
        type: string
      phone:
        type: string
      address:
        type: string
      verified:
        type: string
        format: date
      conciliation:
        # Some member states give consumers a conciliation or ombudsman
        # route before, or instead of, the market surveillance authority
        # (Germany's Schlichtungsstelle BGG under § 34 BFSG, for example).
        # Naming only the surveillance authority would send people to the
        # wrong door, so packs may carry both.
        type: object
        required: [name]
        properties:
          name:
            type: string
            minLength: 1
          url:
            type: string
          email:
            type: string
          phone:
            type: string
          address:
            type: string
          note:
            type: string
  deadlines:
    type: object
    properties:
      enforceableSince:
        type: string
        format: date
      notes:
        type: string
  quality:
    type: string
    enum: [bronze, silver, gold]
  maintainers:
    type: array
    items:
      type: string
  notes:
    type: string
