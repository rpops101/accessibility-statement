# Spain — Ley 11/2023 (Título I transposes Directiva (UE) 2019/882).
#
# Verified against boe.es and dsca.gob.es on 2026-08-03. Re-verify before
# each release (Silver criterion).
#
# Note for reviewers: Spain does NOT have a single national enforcement
# authority. Article 27.3 devolves market surveillance to the seventeen
# comunidades autónomas plus Ceuta and Melilla, which are the bodies that
# investigate and sanction. The state-level Unidad Técnica de Apoyo y
# Coordinación (UTAC) is the public contact point (art. 28.2.f) and acts as
# surveillance authority only where no regional authority has been
# designated (art. 28.2.g). The UTAC role is held by the Dirección General
# de Derechos de las Personas con Discapacidad — not by Consumo.
