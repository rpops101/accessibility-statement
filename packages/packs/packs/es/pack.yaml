  verified: "2026-08-03"
  conciliation:
    name: Autoridad de vigilancia designada por la comunidad autónoma correspondiente (artículo 27.3 de la Ley 11/2023), que es el órgano competente para investigar y sancionar
    note: >-
      También está disponible el arbitraje en materia de igualdad de
      oportunidades, no discriminación y accesibilidad universal (artículo 29.1
      de la Ley 11/2023).
deadlines:
  enforceableSince: "2025-06-28"
  notes: >-
    El régimen sancionador se remite a la legislación sectorial y, supletoriamente,
    al Título III del Real Decreto Legislativo 1/2013 (artículo 30 de la Ley
    11/2023). Conforme a los artículos 83 y 84 de dicho texto refundido, las
    multas van desde 301 euros hasta un máximo de 1.000.000 de euros para las
    infracciones muy graves.
