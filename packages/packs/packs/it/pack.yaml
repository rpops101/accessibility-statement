# Italy — Decreto legislativo 27 maggio 2022, n. 82.
#
# Verificato su normattiva.it, gazzettaufficiale.it e agid.gov.it il
# 2026-08-03. Da riverificare prima di ogni pubblicazione (criterio Silver).
#
# Nota per i revisori: l'art. 21 comma 1 designa AgID come Autorità di
# vigilanza sui SERVIZI. Per i PRODOTTI l'autorità è il Ministero delle
# imprese e del made in Italy (art. 17 comma 2). AGCOM non ha poteri
# sanzionatori ai sensi del d.lgs. 82/2022 — esprime solo un parere sulle
# linee guida (art. 21 comma 2); i suoi poteri sui servizi di media
# audiovisivi derivano dall'art. 31 del d.lgs. 208/2021.
schemaVersion: 1
country: it
name: Italy (Italia)
languages: [it, en]
defaultLanguage: it
legal:
  act: Decreto legislativo 27 maggio 2022, n. 82 (attuazione della direttiva (UE) 2019/882)
  references:
    - Linee guida sull'accessibilità dei servizi (EAA), AgID, versione 1.0 del 4 marzo 2026
    - Legge 9 gennaio 2004, n. 4 (Legge Stanca)
    - Direttiva (UE) 2019/882 (European Accessibility Act)
    - EN 301 549
  sources:
    - https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-05-27;82
