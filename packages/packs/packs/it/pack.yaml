    - https://www.gazzettaufficiale.it/eli/id/2026/03/24/26A01427/SG
enforcement:
  name: Agenzia per l'Italia Digitale (AgID) — Autorità di vigilanza sui servizi ai sensi dell'articolo 21, comma 1, del decreto legislativo 27 maggio 2022, n. 82
  url: https://www.agid.gov.it/it/ambiti-intervento/accessibilita-usabilita
  address: Via Liszt 21, 00144 Roma, Italia
  phone: "+39 06 852641"
  verified: "2026-08-03"
  conciliation:
    name: Portale segnalazioni AgID — reclamo per problemi di accessibilità di un servizio digitale (articolo 21, comma 3, lettera a)
    url: https://segnalazioni.agid.gov.it/
    note: >-
      L'istruttoria preliminare è svolta dal Difensore civico per il digitale,
      secondo il Regolamento AgID sulle modalità di accertamento e di esercizio
      del potere sanzionatorio. La vigilanza sui prodotti spetta invece al
      Ministero delle imprese e del made in Italy (articolo 17, comma 2).
deadlines:
  enforceableSince: "2025-06-28"
  notes: >-
    L'articolo 24 del decreto prevede sanzioni amministrative pecuniarie da
    5.000 a 40.000 euro per la violazione dei requisiti di accessibilità, e da
    2.500 a 30.000 euro per l'inottemperanza agli ordini dell'autorità di
    vigilanza o per la mancata cooperazione. Per i soggetti privati con
    fatturato medio superiore a 500 milioni di euro si applica in ogni caso la
    sanzione fino al 5 per cento del fatturato prevista dall'articolo 9, comma
    1-bis, della legge n. 4 del 2004.
quality: silver
maintainers:
