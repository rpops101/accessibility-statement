enforcement:
  name: Direction générale de la concurrence, de la consommation et de la répression des fraudes (DGCCRF) — autorité de droit commun désignée par l'article L. 511-25-1 du code de la consommation
  url: https://www.economie.gouv.fr/dgccrf
  address: 59 boulevard Vincent Auriol, Télédoc 042, 75703 Paris Cedex 13, France
  phone: "+33 1 44 87 17 17"
  verified: "2026-08-03"
  conciliation:
    name: SignalConso — plateforme officielle de signalement de la DGCCRF (parcours dédié à l'accessibilité depuis décembre 2025)
    url: https://signal.conso.gouv.fr
    note: >-
      Des autorités sectorielles sont compétentes selon le service concerné :
      l'ARCEP pour les communications électroniques, l'Arcom pour l'accès aux
      services de médias audiovisuels, l'ACPR et l'AMF pour l'information
      bancaire, et la Banque de France pour l'authentification et la sécurité
      des paiements.
deadlines:
  enforceableSince: "2025-06-28"
  notes: >-
    Les manquements relèvent de l'article R. 451-4 du code de la consommation
    (contravention de la 5e classe), soit une amende pouvant atteindre 7 500
    euros pour une personne morale, cumulable par infraction constatée. Ce
    régime est distinct de celui de l'article 47-1 de la loi n° 2005-102, qui
    permet à l'Arcom de prononcer des sanctions administratives allant jusqu'à
    50 000 euros pour le manquement à l'obligation d'accessibilité et 25 000
    euros pour les obligations annexes.
