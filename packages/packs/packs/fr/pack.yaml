# France — transposition de la directive (UE) 2019/882.
#
# Vérifié sur legifrance.gouv.fr et economie.gouv.fr le 2026-08-03.
# À revérifier avant chaque publication (critère Silver).
#
# Note pour les relecteurs : la loi n° 2023-171 n'est que le texte
# d'habilitation. Son article 16 crée les articles L. 412-13 et L. 511-25-1
# du code de la consommation ; les règles opérationnelles figurent dans le
# décret n° 2023-931 et l'arrêté du 9 octobre 2023.
#
# L'article L. 511-25-1 désigne PLUSIEURS autorités : la DGCCRF est
# l'autorité de droit commun, mais l'ARCEP (communications électroniques),
# l'Arcom (accès aux services de médias audiovisuels), l'ACPR et l'AMF
# (information bancaire) et la Banque de France (authentification et
# sécurité des paiements) sont compétentes dans leurs secteurs.
# La Délégation interministérielle à l'accessibilité (DIA) n'a AUCUN
# pouvoir de sanction et ne doit pas être citée comme autorité.
