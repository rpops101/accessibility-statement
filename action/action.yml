name: 'accessibility-statement'
description: 'Generate EU Accessibility Act artifacts and fail the build on accessibility conformance regressions.'
author: 'accessibility-statement contributors'
branding:
  icon: 'check-square'
  color: 'blue'

inputs:
  config:
    description: 'Path to a11y-statement.config.yaml'
    required: false
    default: 'a11y-statement.config.yaml'
  jurisdiction:
    description: 'Jurisdiction pack to render with (defaults to the one in the config)'
    required: false
  lang:
    description: 'Statement language (defaults to the first configured language)'
    required: false
  lock:
    description: 'Path to the conformance baseline'
    required: false
    default: 'a11y-statement.lock.json'
  check:
    description: 'Run the regression check and fail the job on a regression'
    required: false
    default: 'true'
  render:
    description: 'Render all artifacts and upload them'
    required: false
    default: 'true'
  out-dir:
    description: 'Directory to render artifacts into'
    required: false
    default: 'accessibility-artifacts'
  comment:
    description: 'Post a conformance summary as a pull-request comment'
    required: false
    default: 'true'
  version:
    description: 'Version of accessibility-statement to run'
    required: false
    default: 'latest'

outputs:
  compliance:
    description: 'Overall compliance status: full | partial | non-compliant'
    value: ${{ steps.run.outputs.compliance }}
  regressions:
    description: 'Number of criteria that regressed against the baseline'
    value: ${{ steps.run.outputs.regressions }}
  artifacts-path:
    description: 'Directory the rendered artifacts were written to'
    value: ${{ steps.run.outputs.artifacts-path }}

runs:
  using: 'composite'
  steps:
    - name: Run accessibility-statement
      id: run
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_JURISDICTION: ${{ inputs.jurisdiction }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_LOCK: ${{ inputs.lock }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_RENDER: ${{ inputs.render }}
        INPUT_OUT_DIR: ${{ inputs.out-dir }}
        INPUT_VERSION: ${{ inputs.version }}
      run: ${{ github.action_path }}/run.sh

    - name: Upload artifacts
      if: ${{ inputs.render == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-statement-artifacts
        path: ${{ inputs.out-dir }}
        if-no-files-found: warn

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summaryPath = process.env.A11Y_STATEMENT_SUMMARY || 'accessibility-statement-summary.md';
          if (!fs.existsSync(summaryPath)) return;
          const body = fs.readFileSync(summaryPath, 'utf8');
          const marker = '<!-- accessibility-statement-summary -->';
          const { data: comments } = await github.rest.issues.listComments({
            ...context.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(
            (c) => c.user.type === 'Bot' && c.body.includes(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
          }
